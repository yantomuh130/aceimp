<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aceimp</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #fff;
    color: #171923;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 680px;
    margin: auto;
    padding: 20px 16px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 85px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

button {
    cursor: pointer;
    font-weight: bold;
    border: none;
}

.upload {
    background: #111827;
    color: white;
    padding: 15px 28px;
    border-radius: 30px;
}

.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    padding: 18px;
    color: #999;
    font-size: 14px;
}

.spinner {
    width: 23px;
    height: 23px;
    border: 3px solid #e5e5e5;
    border-top-color: #3980d8;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    flex-shrink: 0;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.video-box {
    background: #000;
    border-radius: 16px;
    overflow: hidden;
}

video {
    display: block;
    width: 100%;
    max-height: 80vh;
    background: #000;
    object-fit: contain;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 32px;
}

.buttons button {
    width: 100%;
    padding: 21px 12px;
    border: 1px solid #dce1e7;
    border-radius: 13px;
    background: #f9fafb;
    color: #3976d5;
    font-size: 17px;
}

.notice {
    text-align: center;
    margin-top: 22px;
    color: #999;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">aceimp</div>
        <button class="upload" id="upload">Upload</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Memuat video...</span>
    </div>

    <div class="video-box">
        <video id="video" controls playsinline preload="metadata"></video>
    </div>

    <div class="buttons">
        <button id="collection">
            Cek koleksi lainnya
        </button>

        <button id="telegram">
            Join Telegram
        </button>
    </div>

    <div class="notice">Enjoy Watching</div>

</div>

<script>
const ADSTERRA =
"https://auctionr.org/4/045c236f7845efa95328c65af2e004c3";

const TELEGRAM =
"https://t.me/wuikwuik";

const video = document.getElementById("video");
const loading = document.getElementById("loading");

const videoID = decodeURIComponent(
    location.pathname.split("/").pop()
);

const storageKey = "aceimp_" + videoID;

let state = {
    firstAdDone: false,
    secondAdDone: false,
    time: 0
};

function saveState() {
    state.time = video.currentTime || state.time;
    sessionStorage.setItem(
        storageKey,
        JSON.stringify(state)
    );
}

try {
    const saved = sessionStorage.getItem(storageKey);
    if (saved) {
        state = { ...state, ...JSON.parse(saved) };
    }
} catch (e) {
    console.log("Session tidak tersedia");
}

// ===========================
// LOAD VIDEO DARI JSON
// ===========================

async function loadVideo() {
    try {
        const response = await fetch("/videos.json");

        if (!response.ok) {
            throw new Error("JSON tidak ditemukan");
        }

        const data = await response.json();

        const found = data.videos.find(item =>
            String(item.id).trim().toLowerCase() ===
            videoID.trim().toLowerCase()
        );

        if (!found || !found.cdn) {
            throw new Error("ID video tidak ditemukan");
        }

        video.src = found.cdn;
        video.load();

    } catch (error) {
        console.error(error);
        loading.innerHTML = "Video tidak ditemukan.";
    }
}

// ===========================
// PULIHKAN POSISI VIDEO
// ===========================

video.addEventListener("loadedmetadata", function() {
    if (state.time > 0) {
        video.currentTime = Math.min(
            state.time,
            video.duration || state.time
        );
    }

    loading.style.display = "none";
});

video.addEventListener("error", function() {
    loading.style.display = "flex";
    loading.textContent = "Video gagal dimuat.";
});

// ===========================
// IKLAN PERTAMA
// ===========================

video.addEventListener("play", function() {

    if (!state.firstAdDone) {

        state.firstAdDone = true;
        saveState();

        video.pause();

        // Redirect di tab yang sama
        location.href = ADSTERRA;
    }

});

// ===========================
// IKLAN DETIK 15
// ===========================

video.addEventListener("timeupdate", function() {

    if (
        video.currentTime >= 15 &&
        !state.secondAdDone
    ) {

        state.secondAdDone = true;
        state.time = 15;

        saveState();

        video.pause();

        // Redirect di tab yang sama
        location.href = ADSTERRA;
    }

});

// Simpan posisi terakhir secara berkala
video.addEventListener("timeupdate", function() {
    if (state.firstAdDone) {
        state.time = video.currentTime;
        sessionStorage.setItem(
            storageKey,
            JSON.stringify(state)
        );
    }
});

// ===========================
// TOMBOL
// ===========================

document.getElementById("upload").onclick = function() {
    location.href = ADSTERRA;
};

document.getElementById("collection").onclick = function() {
    location.href = ADSTERRA;
};

document.getElementById("telegram").onclick = function() {
    location.href = TELEGRAM;
};

// ===========================
// MULAI
// ===========================

loadVideo();

</script>

</body>
</html>
