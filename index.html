<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aceimp - Video</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff;
    color: #171923;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 680px;
    margin: auto;
    padding: 20px 16px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

button {
    cursor: pointer;
    font-weight: bold;
}

.upload {
    background: #111827;
    color: white;
    border: none;
    padding: 15px 28px;
    border-radius: 30px;
}

.content {
    text-align: center;
    margin-top: 100px;
}

.content h2 {
    font-size: 22px;
}

.content p {
    color: #999;
    font-size: 14px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 35px;
}

.buttons button {
    width: 100%;
    padding: 21px 12px;
    border: 1px solid #dce1e7;
    border-radius: 13px;
    background: #f9fafb;
    color: #3976d5;
    font-size: 17px;
}

.notice {
    text-align: center;
    margin-top: 25px;
    color: #999;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">aceimp</div>
        <button class="upload" id="upload">
            Upload
        </button>
    </div>

    <div class="content">
        <h2>Welcome to aceimp</h2>
        <p>Enjoy watching your favorite videos.</p>
    </div>

    <div class="buttons">

        <button id="collection">
            Cek koleksi lainnya
        </button>

        <button id="telegram">
            Join Telegram
        </button>

    </div>

    <div class="notice">
        Enjoy Watching
    </div>

</div>

<script>

const ADSTERRA =
"https://auctionr.org/4/045c236f7845efa95328c65af2e004c3";

const TELEGRAM =
"https://t.me/wuikwuik";

document.getElementById("upload").onclick = function() {
    location.href = ADSTERRA;
};

document.getElementById("collection").onclick = function() {
    location.href = ADSTERRA;
};

document.getElementById("telegram").onclick = function() {
    location.href = TELEGRAM;
};

</script>

</body>
</html>
